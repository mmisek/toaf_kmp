# Most Bitbucket -> GitHub.
#
# Kod zyje na Bitbucket, ale build macOS musi pojsc przez GitHub Actions, bo tylko
# GitHub daje hostowane runnery macOS. Ten pipeline po kazdym pushu wypycha commity
# na repozytorium-lustro na GitHubie, a to wyzwala .github/workflows/macos-build.yml.
#
# Konfiguracja (Repository settings -> Repository variables):
#   GH_OWNER  - wlasciciel repo na GitHub (uzytkownik albo organizacja)
#   GH_REPO   - nazwa repo-lustra na GitHub
#   GH_TOKEN  - token GitHuba, ZAZNACZ "Secured". Fine-grained PAT z uprawnieniem
#               Contents: Read and write do tego jednego repo w zupelnosci wystarczy.
#
# Push wykonywany tokenem PAT wyzwala workflow w Actions (w odroznieniu od pushu
# wbudowanym GITHUB_TOKEN wewnatrz samych Actions, ktory ich nie wyzwala).
#
# UWAGA: lustro jest jednokierunkowe i wypychane z --force. Nie commituj niczego
# bezposrednio na GitHubie - przy najblizszym pushu z Bitbucketa zostanie nadpisane.

image: atlassian/default-image:4

clone:
  # Push wymaga pelnej historii; domyslne plytkie klonowanie Bitbucketa ja obcina.
  depth: full

definitions:
  steps:
    - step: &mirror-to-github
        name: Lustro na GitHub
        clone:
          depth: full
        script:
          - |
            if [ -z "$GH_OWNER" ] || [ -z "$GH_REPO" ] || [ -z "$GH_TOKEN" ]; then
              echo "Brak zmiennych GH_OWNER / GH_REPO / GH_TOKEN w ustawieniach repozytorium."
              exit 1
            fi
          - REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GH_OWNER}/${GH_REPO}.git"
          - git push --force "$REMOTE" "HEAD:refs/heads/${BITBUCKET_BRANCH}"
          - git push --force --tags "$REMOTE"
          - echo "Wypchnieto ${BITBUCKET_BRANCH}. Build macOS - https://github.com/${GH_OWNER}/${GH_REPO}/actions"

pipelines:
  default:
    - step: *mirror-to-github
